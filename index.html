<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arena Demo — один игрок против ботов</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" id="game-css" />
  </head>
  <body>
    <main class="wrap" role="main">
      <header class="hud">
        <h1 class="title">Arena Demo</h1>
        <p class="sub">
          WASD — движение · мышь — прицел · ЛКМ / ПКМ (удерж.) — атака · P / Esc — пауза · 1 / 2 — награда после уровня · M — меню · R — заново / новая игра
        </p>
        <div class="stats" aria-live="polite">
          <span id="hp">HP: 100</span>
          <span id="bots">Боты: 3</span>
          <span id="state" class="state"></span>
        </div>
      </header>
      <canvas
        id="game"
        width="960"
        height="540"
        tabindex="0"
        aria-label="Игровое поле: вид сверху, вы — синий круг, боты — красные"
      ></canvas>
    </main>
    <button type="button" id="fs-hint" hidden aria-label="На весь экран">⛶ На весь экран</button>
    <script src="js/game.js" id="game-js" defer></script>
    <script>
      (function () {
        var SW_URL = "sw.js?v=3";
        if (!("serviceWorker" in navigator)) return;
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
        navigator.serviceWorker.register(SW_URL).then(function (reg) {
          function tryUpdate() {
            reg.update().catch(function () {});
          }
          tryUpdate();
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") tryUpdate();
          });
          reg.addEventListener("updatefound", function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", function () {
              if (nw.state === "installed" && navigator.serviceWorker.controller) {
                nw.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });
        }).catch(function () {});
      })();
    </script>
  </body>
</html>
