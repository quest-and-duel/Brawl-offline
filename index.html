<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Arena Demo — один игрок против ботов</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="wrap" role="main">
      <header class="hud">
        <h1 class="title">Arena Demo</h1>
        <p class="sub">
          WASD — движение · мышь — прицел · ЛКМ / ПКМ (удерж.) — атака · P / Esc — пауза · 1 / 2 — награда после уровня · M — меню · R — заново / новая игра
        </p>
        <div class="stats" aria-live="polite">
          <span id="hp">HP: 100</span>
          <span id="bots">Боты: 3</span>
          <span id="state" class="state"></span>
        </div>
      </header>
      <canvas
        id="game"
        width="960"
        height="540"
        tabindex="0"
        aria-label="Игровое поле: вид сверху, вы — синий круг, боты — красные"
      ></canvas>
    </main>
    <script src="js/game.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
